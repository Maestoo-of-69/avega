{# Inline stroke icons (24x24 grid). Usage: {{ icon('home') }} #}

<path d="m5 12.5 4.5 4.5L19 7.5"/>

<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18Z"/>

</svg>

    <linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36b6ff"/><stop offset="1" stop-color="#1366e8"/></linearGradient>
    <linearGradient id="lgB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#0b55d6"/></linearGradient>
  </defs>
